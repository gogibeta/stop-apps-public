name: Android CI + emulator test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  emulator-test:
    needs: build
    # ARM64 Linux runners run arm64 images natively-ish; x86 Linux and
    # macOS runners lack KVM/HVF, so x86 emulation exceeds the boot timeout.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: apk

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run emulator test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: arm64-v8a
          profile: pixel_7
          script: bash ci/diag-launch-test.sh ci/fixtures/stop-apps-1.3.1-diag.apk && bash ci/emulator-test.sh apk/app-debug.apk

      - name: Upload test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-out
          path: ci/out/
