name: Android CI + emulator test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build release APK (R8 minified + shrunk)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk

  emulator-test:
    needs: build
    # x86_64 Linux boots under software emulation in ~8 min (proven by
    # run 36588032525); give it a generous timeout instead of fighting
    # for hardware acceleration that hosted runners don't provide.
    # Three emulator attempts max (initial + two fresh-emulator retries on
    # infra flake): the job timeout below bounds the whole thing.
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: apk

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install libpulse0 for the emulator
        # 2026-09-30: the emulator's qemu binary links libpulse.so.0 at
        # process startup, but the ubuntu runner image no longer ships it.
        # Even with -noaudio, boots died instantly with "error while loading
        # shared libraries: libpulse.so.0" (run 36698061497), then the job
        # sat in a 30-min boot timeout. No emulator flag can avoid a
        # DT_NEEDED library — it has to be installed. Once per job covers
        # the retry step too (same runner machine).
        # 2026-09-30 (run 36710697785): emulator 37.x fatals at startup with
        # "Could not load the Qt platform plugin xcb ... no Qt platform
        # plugin could be initialized" and never boots. libxcb-cursor0 is
        # what the warning itself asks for; more importantly we now pass
        # -no-window so the Qt UI never starts on the headless runner.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0 libxcb-cursor0

      - name: Run emulator test
        id: emulator_test
        # Let the retry step below decide: a retryable infra flake
        # (script leaves ci/out/RETRYABLE) gets a fresh emulator;
        # a genuine failure goes straight to the Verdict step.
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          # 2026-10-01 (run 36764947234): target default = AOSP without GMS.
          # Both attempts of that run wedged system_server, with GMS/phone
          # processes dominating the ANR list (gms.persistent, gms,
          # googlequicksearchbox, inputmethod.latin, com.google.android.as,
          # nexuslauncher) plus RoleControllerService monitor contention.
          # The app under test needs no Google services, so drop GMS
          # entirely for a lighter, less contention-prone framework on the
          # KVM-less software-emulation runner.
          target: default
          arch: x86_64
          profile: pixel_7
          # 2026-09-30: 4 GB RAM for the AVD. Run 36636567833 wedged
          # system_server ("Process system isn't responding") for ~50 min on
          # the software emulator; more headroom + the hardened test harness
          # (adb timeouts, ANR escalation, wedged-system recovery) should
          # stop a wedged framework from killing the run.
          ram-size: 4096M
          # UI-test hygiene on a slow emulator: kill animations (fewer timing
          # flakes) and skip snapshot load (a known source of wedged boots).
          # 2026-09-30: -no-window is REQUIRED on the headless runner —
          # without it emulator 37.x fatals at startup ("no Qt platform
          # plugin could be initialized") and the job burns a 30-min boot
          # timeout (run 36710697785). -gpu swiftshader_indirect keeps
          # software GLES working without a window.
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          emulator-boot-timeout: 1800
          # NOTE: the 1.3.1-diag fixture APK was retired 2026-09-30: it was built
          # with the old manual kotlinc+d8 pipeline and crashes on launch with
          # missing androidx.startup.R$string (this CI run reproduced the
          # user's "instantly crashing" report and root-caused it). The
          # Gradle-built APK under test does not have this problem.
          script: bash ci/emulator-test.sh apk/app-debug.apk

      - name: Retry emulator test on fresh emulator (infra flake only)
        id: emulator_test_retry1
        # Fires only when the first attempt died on infrastructure, never on
        # a genuine test failure. Two infra shapes:
        #   1. the test script ran but adb died (script leaves ci/out/RETRYABLE);
        #   2. the emulator-runner action itself failed at boot (run 36702422694:
        #      30-min "Timeout waiting for emulator to boot", device never
        #      appeared), so the script never ran and ci/out is empty.
        # A genuine failure (script ran, wrote logs, no RETRYABLE/TEST_OK)
        # still goes straight to the Verdict step and fails honestly.
        # Each runner step boots its own emulator, so this is a full
        # recreate, not a resume of the dead one.
        if: >
          steps.emulator_test.outcome == 'failure' &&
          (hashFiles('ci/out/RETRYABLE') != '' ||
           (hashFiles('ci/out/TEST_OK') == '' && hashFiles('ci/out/**') == ''))
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          # AOSP without GMS: see the target note on the first attempt.
          target: default
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          emulator-boot-timeout: 1800
          # Separate output dir so the retry's diagnostics don't clobber
          # the first attempt's.
          script: OUT_DIR=ci/out-retry bash ci/emulator-test.sh apk/app-debug.apk

      - name: Second retry on fresh emulator (infra flake only)
        id: emulator_test_retry2
        # Fires only when the first retry ALSO died on infrastructure and no
        # attempt produced TEST_OK. A genuine failure in either attempt fails
        # honestly at the Verdict step instead. Each runner step boots its
        # own emulator, so this is another full recreate.
        if: >
          steps.emulator_test_retry1.outcome == 'failure' &&
          hashFiles('ci/out/TEST_OK') == '' &&
          hashFiles('ci/out-retry/TEST_OK') == '' &&
          (hashFiles('ci/out-retry/RETRYABLE') != '' ||
           hashFiles('ci/out-retry/**') == '')
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          # AOSP without GMS: see the target note on the first attempt.
          target: default
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          emulator-boot-timeout: 1800
          # Separate output dir so this retry's diagnostics don't clobber
          # the earlier attempts'.
          script: OUT_DIR=ci/out-retry2 bash ci/emulator-test.sh apk/app-debug.apk

      - name: Upload test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-out
          path: ci/out*/

      - name: Verdict
        # The test passes iff any attempt wrote TEST_OK. Two retries max:
        # a third RETRYABLE still fails honestly here.
        if: always()
        run: |
          if [ -f ci/out/TEST_OK ] || [ -f ci/out-retry/TEST_OK ] || [ -f ci/out-retry2/TEST_OK ]; then
            echo "emulator test passed"
          else
            echo "emulator test failed (no TEST_OK from three attempts)"
            exit 1
          fi
